  <title id="cds-logo-title">Core Design System (CDS) logo</title>
  <desc id="cds-logo-desc">Horizontal lock-up on a dark background: the Core Grid mark on the left, a three by three grid of squares with a solid core in the centre, four connected modules around it and outlined corners; on the right the words Core Design System and the line Foundations, Components, Experiences. Repository identity artwork; not a CDS design token or normative visual value.</desc>
