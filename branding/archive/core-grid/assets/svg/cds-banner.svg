  <title id="cds-banner-title">Core Design System (CDS) banner</title>
  <desc id="cds-banner-desc">Repository banner on a dark background. Left: the overline Design system for the Core ecosystem, the title Core Design System, the line Foundations. Components. Experiences., and the line Tokens, Accessibility, Evidence, Governance. Right: the Core Grid extended to a five by five field; a solid core in the centre is connected to four modules, and the surrounding squares fade from filled to faint outlines as they move away from the core. Repository identity artwork; not a CDS design token or normative visual value.</desc>
