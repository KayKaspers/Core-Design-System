<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="cds-mark-title cds-mark-desc">
  <title id="cds-mark-title">Core Design System (CDS) mark</title>
  <desc id="cds-mark-desc">The Core Grid: a three by three grid of rounded squares on a dark rounded tile. The solid centre square is the core; a smaller inner square sits inside it, separated by a thin ring. Four filled modules sit directly above, right, below and left of the core, each joined to it by a short connector. The four corner squares are outlines only, suggesting that the grid continues. Repository identity artwork; not a CDS design token or normative visual value.</desc>
